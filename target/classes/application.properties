# Configuration de l'application Crédit 360°
spring.application.name=credit360-backend
server.port=8080

# Base de données H2
spring.datasource.url=jdbc:h2:mem:credit360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Limites Upload de fichiers (5 Mo recommandé, max 10 Mo pour tolérance)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Configuration Sécurité JWT
credit360.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B597036763979244226452948404D6351655468576D5A7134743777217A25432A462D
credit360.jwt.expiration-ms=86400000

# Répertoire de stockage des fichiers et pièces jointes
credit360.storage.upload-dir=./uploads

# Configuration Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
